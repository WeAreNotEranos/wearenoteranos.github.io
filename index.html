  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    min-height:100%;min-height:100dvh;

  /* Холст со стеклом (WebGL) и запасной фон */
  #gl,.bg{position:fixed;left:0;top:0;z-index:-1}
  .bg{width:100%;height:100%;background:#234 center/cover no-repeat}
  html:not(.nogl) .bg{display:none}
  .nogl #gl{display:none}

  /* Запасной вариант, если WebGL недоступен */
  .nogl .glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3)}
  .nogl .lens{background:rgba(255,255,255,.3);box-shadow:inset 1px 1px 1px rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.2)}

  .card{width:100%;max-width:400px;padding:40px 26px 30px;border-radius:40px;text-align:center;

  @keyframes rise{from{transform:translateY(18px) scale(.97)}to{transform:none}}

  .avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;
    border:3px solid rgba(255,255,255,.6);box-shadow:0 0 0 6px rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.35)}
  h1{font-size:32px;font-weight:600;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.45)}

  .links{display:flex;flex-direction:column;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;
    color:#fff;text-decoration:none;font-size:16px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.45);
    transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .btn:hover{transform:translateY(-2px) scale(1.02)}
  .btn:active{transform:scale(.94,.9)}
  .icon{width:22px;height:22px;fill:currentColor;flex-shrink:0}

  /* Переключатель тем */
  .switcher{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));display:flex;padding:6px;border-radius:999px}
  .opt{position:relative;z-index:2;width:48px;height:48px;border:0;background:none;cursor:pointer;

  .opt i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);
    box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .opt.on i{transform:scale(1.15)}
  .lens{position:absolute;z-index:1;top:6px;left:6px;width:48px;height:48px;border-radius:999px;
    transition:left .28s cubic-bezier(.3,1.3,.5,1),width .28s cubic-bezier(.3,1.3,.5,1)}

  footer{margin-top:26px;font-size:13px;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.5)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

    <button class="opt" aria-label="Тема 4"><i style="background:#6d6d78"></i></button>

<script>
/* ===== Темы: фото, оттенок стекла, цвет свечения ===== */
const T = [
  {img:'bg.JPG',  tint:[.78,.88,1],  glow:[.35,.60,1],  shade:.03, fb:['#6a8fb5','#2a3f5f']},
  {img:'bg2.JPG', tint:[1,.85,.60],  glow:[1,.62,.30],   shade:.03, fb:['#f0a860','#5a2a10']},
  {img:'bg3.JPG', tint:[.75,.90,1],  glow:[.30,.70,1],   shade:.04, fb:['#7cc6e8','#10304a']},
  {img:'bg4.JPG', tint:[.85,.85,.9], glow:[.55,.60,.80], shade:.08, fb:['#555','#111']}
];

/* ===== Шейдер: преломление, дисперсия, кромка ===== */
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
precision highp float;
uniform vec2 uRes,uSzA,uSzB; uniform sampler2D uA,uB;
uniform float uMix,uDpr,uShade; uniform int uN;
uniform vec4 uBox[8]; uniform vec2 uPar[8];

vec2 cover(vec2 p,vec2 sz){float s=max(uRes.x/sz.x,uRes.y/sz.y);vec2 d=sz*s;return (p-(uRes-d)*.5)/d;}
vec3 bgAt(vec2 p){
  if(uMix<.001) return texture2D(uA,cover(p,uSzA)).rgb;
  if(uMix>.999) return texture2D(uB,cover(p,uSzB)).rgb;
  return mix(texture2D(uA,cover(p,uSzA)).rgb,texture2D(uB,cover(p,uSzB)).rgb,uMix);
}
float sdBox(vec2 p,vec4 b,float r){
  vec2 q=abs(p-(b.xy+b.zw*.5))-b.zw*.5+r;
  return length(max(q,0.))+min(max(q.x,q.y),0.)-r;
}
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k*.25;}
/* «капельное» слияние: все блоки с k=3 сплавляются в одну форму */
float sdBlob(vec2 p){
  float d=1e5;
  for(int i=0;i<8;i++){
    if(i>=uN) break;
    if(uPar[i].y>2.5) d=smin(d,sdBox(p,uBox[i],uPar[i].x),28.*uDpr);
  }
  return d;
}

/* Чистое стекло: внутри фон без искажений, преломление только в тонкой кромке */
vec3 glassCol(vec2 p,float depth,vec2 n,float rimW){
  float t=clamp(depth/rimW,0.,1.);
  float bend=pow(1.-t,2.6);
  vec2 off=n*bend*rimW*1.7;
  vec3 g=vec3(bgAt(p+off).r,bgAt(p+off*1.12).g,bgAt(p+off*1.26).b);   /* дисперсия */
  g=mix(vec3(dot(g,vec3(.299,.587,.114))),g,1.12);
  vec2 L=normalize(vec2(-.7,-.7));
  float lit=.3+.7*pow(abs(dot(n,L)),1.3);
  vec3 iri=.55+.45*cos(atan(n.y,n.x)+vec3(0.,2.1,4.2));              /* розовый-жёлтый-зелёный */
  g+=mix(vec3(1.),iri,.55)*smoothstep(1.8*uDpr,0.,depth)*lit*.95;     /* тонкое яркое кольцо */
  g+=iri*smoothstep(1.4*uDpr,0.,abs(depth-4.*uDpr))*lit*.22;          /* радужная линия внутри */
  g*=1.-.10*bend*(1.-lit);                                            /* лёгкий скос в тени */
  g+=vec3(1.)*pow(max(dot(n,L),0.),10.)*(1.-t)*.28;                   /* блик */
  return g;
}

void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  vec3 col=bgAt(p)*(1.-uShade);

  for(int i=0;i<8;i++){
    if(i>=uN) break;
    if(uPar[i].y>1.5) continue;
    float d=sdBox(p-vec2(0.,8.*uDpr),uBox[i],uPar[i].x);
    col*=1.-.12*smoothstep(26.*uDpr,0.,max(d,0.));
  }

  for(int i=0;i<8;i++){
    if(i>=uN) break;
    vec4 b=uBox[i]; float r=uPar[i].x; float k=uPar[i].y;
    if(k>2.5) continue;
    float d=sdBox(p,b,r);
    if(d>1.) continue;
    vec2 n=normalize(vec2(sdBox(p+vec2(1.,0.),b,r)-sdBox(p-vec2(1.,0.),b,r),
                          sdBox(p+vec2(0.,1.),b,r)-sdBox(p-vec2(0.,1.),b,r))+1e-5);
    float rimW=min(min(b.z,b.w)*.4,18.*uDpr)*(k>1.5?1.4:1.);
    col=mix(col,glassCol(p,-d,n,rimW),smoothstep(1.,-1.,d));
  }

  float db=sdBlob(p);
  if(db<=1.){
    vec2 n=normalize(vec2(sdBlob(p+vec2(1.,0.))-sdBlob(p-vec2(1.,0.)),
                          sdBlob(p+vec2(0.,1.))-sdBlob(p-vec2(0.,1.)))+1e-5);
    col=mix(col,glassCol(p,-db,n,16.*uDpr),smoothstep(1.,-1.,db));
  }
  gl_FragColor=vec4(col,1.);
}`;

const html = document.documentElement;
const cv = document.getElementById('gl');
const bgDiv = document.getElementById('bg');
let gl = null, U = {}, texA, texB, showB = false, mix = 0, target = 0, dpr = 1;

try {
  gl = cv.getContext('webgl', {antialias:false, alpha:false});
  if (!gl) throw 0;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw 0; return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw 0;
  gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ['uRes','uSzA','uSzB','uMix','uDpr','uShade','uTint','uGlow','uN','uA','uB','uBox[0]','uPar[0]']
    .forEach(n => U[n] = gl.getUniformLocation(pr, n));
  const mk = unit => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([30,40,60,255]));
    return t; };
  texA = mk(0); texB = mk(1);
  gl.uniform1i(U.uA, 0); gl.uniform1i(U.uB, 1);
  gl.uniform2f(U.uSzA, 1, 1); gl.uniform2f(U.uSzB, 1, 1);
} catch (e) { gl = null; html.classList.add('nogl'); }

function resize() {
  if (!gl) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

/* Загрузка фото (с запасным градиентом, если файла нет) */
function loadTex(i) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 2048 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c);
    };
    im.onerror = () => {
      const c = document.createElement('canvas'); c.width = 64; c.height = 128;
      const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 128);
      g.addColorStop(0, T[i].fb[0]); g.addColorStop(1, T[i].fb[1]);
      x.fillStyle = g; x.fillRect(0, 0, 64, 128); res(c);
    };
    im.src = T[i].img;
  });
}

let cur = 0;
function setTheme(i, instant) {
  cur = i;
  try { localStorage.setItem('theme', i); } catch (e) {}
  place(i, !instant);
  if (!gl) { bgDiv.style.backgroundImage = "url('" + T[i].img + "')"; return; }
  loadTex(i).then(c => {
    if (i !== cur) return;
    const unit = showB ? 0 : 1;               /* заливаем в скрытую текстуру */
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, unit ? texB : texA);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.uniform2f(unit ? U.uSzB : U.uSzA, c.width, c.height);
    showB = !showB; target = showB ? 1 : 0;
    if (instant) mix = target;
  });
}

/* ===== Рендер: каждый кадр читаем положение стеклянных блоков ===== */
const els = [...document.querySelectorAll('.glass')];
const boxes = new Float32Array(32), pars = new Float32Array(16);
function frame() {
  if (gl) {
    mix += (target - mix) * 0.1; if (Math.abs(target - mix) < .002) mix = target;
    let n = 0;
    for (const el of els) {
      if (n >= 8) break;
      const r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) continue;
      const sc = r.width / (el.offsetWidth || r.width);
      const rad = (el.dataset.r ? +el.dataset.r : el.offsetHeight / 2) * sc;
      boxes.set([r.left * dpr, r.top * dpr, r.width * dpr, r.height * dpr], n * 4);
      pars.set([rad * dpr, el.dataset.k ? +el.dataset.k : 1], n * 2);
      n++;
    }
    const t = T[cur];
    gl.uniform2f(U.uRes, cv.width, cv.height);
    gl.uniform1f(U.uMix, mix); gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uShade, t.shade);
    gl.uniform3fv(U.uTint, t.tint); gl.uniform3fv(U.uGlow, t.glow);
    gl.uniform1i(U.uN, n);
    gl.uniform4fv(U['uBox[0]'], boxes); gl.uniform2fv(U['uPar[0]'], pars);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);
}

/* ===== Переключатель: капля растягивается между точками ===== */
const SIZE = 48, PAD = 6;
const lens = document.querySelector('.lens');
const opts = [...document.querySelectorAll('.opt')];
let pos = 0;
function place(i, animate) {
  const from = pos;
  if (animate && from !== i) {
    lens.style.left = PAD + Math.min(from, i) * SIZE + 'px';
    lens.style.width = SIZE + Math.abs(i - from) * SIZE + 'px';
    setTimeout(() => { lens.style.left = PAD + i * SIZE + 'px'; lens.style.width = SIZE + 'px'; }, 170);
  } else { lens.style.left = PAD + i * SIZE + 'px'; lens.style.width = SIZE + 'px'; }
  opts.forEach((o, k) => o.classList.toggle('on', k === i));
  pos = i;
}
opts.forEach((o, i) => o.addEventListener('click', () => setTheme(i, false)));

let saved = 0;
try { saved = parseInt(localStorage.getItem('theme')) || 0; } catch (e) {}
if (saved < 0 || saved > 3) saved = 0;
lens.style.transition = 'none';
setTheme(saved, true);
requestAnimationFrame(() => requestAnimationFrame(() => lens.style.transition = ''));
frame();
</script>
